name: Descomprimir ZIP
on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir
        run: |
          for f in $(find . -name "*.zip" -not -path "./.git/*"); do
            unzip -o "$f" -d "$(dirname "$f")"
            rm -f "$f"
          done
      - name: Confirmar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Descomprimir contenido subido" || exit 0
          git push