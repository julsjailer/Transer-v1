name: Descomprimir ZIP
on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ver qué ZIP hay
        run: find . -name "*.zip" -not -path "./.git/*" -exec ls -lh {} +

      - name: Descomprimir
        shell: bash
        run: |
          set -euo pipefail
          total=0
          while IFS= read -r -d '' f; do
            echo "Descomprimiendo: $f"
            unzip -o "$f" -d "$(dirname "$f")"
            rm -f -- "$f"
            total=$((total+1))
          done < <(find . -name "*.zip" -not -path "./.git/*" -print0)
          echo "ZIP procesados: $total"

      - name: Confirmar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Descomprimir contenido subido" || exit 0
          git push